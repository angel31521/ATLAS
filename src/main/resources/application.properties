spring.application.name=atlas

spring.datasource.url=jdbc:h2:mem:demo
spring.datasource.username=sa
spring.datasource.password=

# Crea y borra las tablas en cada arranque, a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop

# Enseña el SQL que genera Hibernate: se aprende mucho mirándolo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web para mirar la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true