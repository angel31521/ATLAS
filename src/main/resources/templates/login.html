<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ATLAS</title>
    <html xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>

 <div class="login_container">
        

        <h1 th:text="'Login ' + ${tipoUsuario}"></h1>
        
        
        <form id="loginForm" action="" method="POST">

            <div class="form_grupo">
                <label for="username">Nombre completo</label>
                <input type="text" id="username" name="username" placeholder="John Doe" required>
            </div>
            
            <div class="form_grupo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form_grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
            </div>

            <div class="form_grupo">
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
            </div>

            <div class="checkbox_terms form_grupo">
                <label for="terms">Acepta los terminos y condiciones.</label>
                <input type="checkbox" id="terms" name="terms" required>
            </div>

            <button type="submit" class="boton-submit" th:text="'Crear Cuenta de ' +  ${tipoUsuario}"></button>
            
        </form>

        <div class="form_footer">
            <p>¿Ya tienes una cuenta? <a href="#">Inicia sesion</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            const email = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const conf_pass = document.getElementById('confirm_password').value;

            if (pass.length < 6) {
                event.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres.');
            }

            if (pass != conf_pass) {
                event.preventDefault();
                alert('La contraseña debe ser igual.')
            }
        });
    </script>



</body>
</html>
