<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ATLAS</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="container">

        <h1>Iniciar sesión</h1>

        <p th:if="${mensajeExito != null}" th:text="${mensajeExito}"></p>

        <form id="loginForm" th:action="@{/login}" method="POST">

            <div class="form_grupo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form_grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>

            <p th:if="${error != null}" th:text="${error}" class="error"></p>

            <button type="submit" class="boton-submit">Iniciar sesión</button>
        </form>

        <div class="form_footer">
            <p>¿No tienes una cuenta? <a th:href="@{/signup}">Regístrate</a></p>
        </div>
    </div>

</body>
</html>
