<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up ATLAS</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="container">

        <h1>Crear cuenta</h1>

        <form id="sign-upForm" th:action="@{/signup}" method="POST" th:object="${usuario}">

            <div class="form_grupo">
                <label for="username">Nombre completo</label>
                <input type="text" id="username" name="username" placeholder="John Doe" th:field="*{nombre}" required>
            </div>

            <div class="form_grupo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" th:field="*{correo}" required>
            </div>

            <!-- Selector de rol (lista desplegable) -->
            <div class="form_grupo">
                <label for="rol">Rol</label>
                <select id="rol" th:field="*{rol}" required>
                    <option value="">Selecciona tu rol</option>
                    <option value="COORDINADOR">Coordinador</option>
                    <option value="DOCENTE">Docente</option>
                </select>
            </div>

            <div class="form_grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Crea una contraseña" th:field="*{contraseña}" required>
            </div>

            <div class="form_grupo">
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
            </div>

            <div class="checkbox_terms form_grupo">
                <label for="terms">Acepta los terminos y condiciones.</label>
                <input type="checkbox" id="terms" name="terms" required>
            </div>

            <p th:if="${error != null}" th:text="${error}" class="error"></p>

            <button type="submit" class="boton-submit">Crear cuenta</button>

        </form>

        <div class="form_footer">
            <p>¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
        </div>
    </div>

    <script>
        document.getElementById('sign-upForm').addEventListener('submit', function(event) {
            const pass = document.getElementById('password').value;
            const conf_pass = document.getElementById('confirm_password').value;

            if (pass.length < 6) {
                event.preventDefault();
                alert('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            if (pass !== conf_pass) {
                event.preventDefault();
                alert('Las contraseñas deben ser iguales.');
            }
        });
    </script>

</body>
</html>
